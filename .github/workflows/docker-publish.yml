name: Build and publish Docker image

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Run unit and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q .
          bash -n entrypoint.sh
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build amd64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: livebarnscrape:ci-amd64
          load: true
          platforms: linux/amd64
          build-args: |
            BUILD_SOURCE=https://github.com/${{ github.repository }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
      - name: Build arm64 image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: livebarnscrape:ci-arm64
          load: true
          platforms: linux/arm64
          build-args: |
            BUILD_SOURCE=https://github.com/${{ github.repository }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
      - name: Smoke-test arm64 image
        run: docker run --rm --platform linux/arm64 --entrypoint python livebarnscrape:ci-arm64 -c 'import livebarn_manager; from startup_db import classify_database; from pathlib import Path; print("arm64-smoke=PASS", livebarn_manager.get_health_status()["schedule"]["state"], classify_database(Path("/tmp/absent.db"))[0])'

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/livebarnscrape
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=tag

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SOURCE=https://github.com/${{ github.repository }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
